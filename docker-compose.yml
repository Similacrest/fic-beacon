services:
  beacon:
    build:
      context: .
    restart: unless-stopped
    # Optional: run as a non-root user (default 0:0 = unchanged). The /data volume must be writable
    # by it: `docker run --rm -v <project>_beacon-data:/data busybox chown -R UID:GID /data`.
    user: "${BEACON_UID:-0}:${BEACON_GID:-0}"
    depends_on:
      - fetcher
    ports:
      - "${BEACON_PORT:-8000}:8000"
    volumes:
      # App state (SQLite DB)
      - beacon-data:/data
      # Calibre library: mounted READ-ONLY here — only the fetcher writes it.
      - ${CALIBRE_LIBRARY_PATH:-.}:/calibre-library:ro
    environment:
      BEACON_BASE_URL: "${BEACON_BASE_URL:-http://localhost:8000}"
      # Optional, see README. Key-only: passed through from .env/the shell when set, and not
      # defined in the container at all when not — so it can't clobber a value set another way.
      BEACON_FEEDBACK_BASE_URL:
      BEACON_LEGACY_BASE_URLS:
      BEACON_CALIBRE_LIBRARY_PATH: "/calibre-library"
      BEACON_DATABASE_URL: "sqlite:////data/fic-beacon.db"
      # The isolated FanFicFare/Calibre fetcher (see ./fetcher).
      BEACON_FETCHER_URL: "http://fetcher:8080"
      # Timezone for drop/sweep schedules (IANA name, e.g. Europe/Tallinn). Unset → UTC.
      BEACON_TZ: "${BEACON_TZ:-UTC}"
      # Align the container OS clock with BEACON_TZ too. APScheduler is tz-aware, but keeping
      # the wall clock in the same zone keeps log timestamps sane and guards against any naive
      # datetime slipping into a schedule (a UTC-clock container + a non-UTC scheduler tz would
      # otherwise fire jobs hours early — see app/scheduler.py:_now).
      TZ: "${BEACON_TZ:-UTC}"
      # App log level. Set DEBUG to trace the WebSub subscribe→verify→store→push flow.
      BEACON_LOG_LEVEL: "${BEACON_LOG_LEVEL:-INFO}"
      # Generate a secret: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # BEACON_FEED_SECRET: "${BEACON_FEED_SECRET:}"   # seeds the DB on first run only; DB wins after
      # Deny-by-default gate: the reverse proxy must send this as X-Beacon-Proxy-Token. Unset +
      # non-loopback bind → admin/non-public routes are refused (see CHANGELOG, Security).
      BEACON_PROXY_TOKEN: "${BEACON_PROXY_TOKEN:-}"
      BEACON_BIND_HOST: "0.0.0.0"
      # Trusted-network opt-out of the proxy gate (no auth on /admin!). Ignored when a token is set.
      BEACON_ADMIN_OPEN: "${BEACON_ADMIN_OPEN:-false}"
      # Shared secret for beacon → fetcher calls; set the same FETCHER_TOKEN on the fetcher.
      BEACON_FETCHER_TOKEN: "${FETCHER_TOKEN:-}"
      BEACON_WEBSUB_CALLBACK_HOSTS: "${BEACON_WEBSUB_CALLBACK_HOSTS:-}"

  # FanFicFare + calibredb — the ONLY container that writes the Calibre library.
  # Coexists with an external calibre-web pointed at the same library folder.
  fetcher:
    build:
      context: ./fetcher
    restart: unless-stopped
    # Run as the library's owner so EPUBs/folders calibredb creates match it (default root:root
    # otherwise — the fetcher is the sole writer). Set FETCHER_UID/FETCHER_GID in .env to the
    # library owner (find it: `stat -c '%u:%g' "$CALIBRE_LIBRARY_PATH"`). Unset → 0:0 (root),
    # the old behaviour. FanFicFare works in /tmp and calibredb's config lives under HOME, so
    # HOME is pointed at world-writable /tmp for the arbitrary non-root UID.
    user: "${FETCHER_UID:-0}:${FETCHER_GID:-0}"
    volumes:
      # Same library as beacon, but READ-WRITE here.
      - ${CALIBRE_LIBRARY_PATH:-.}:/calibre-library
      # personal.ini (site logins) — edit it directly in this container/host path.
      - ${FETCHER_CONFIG_PATH:-./fetcher/config}:/config
    environment:
      HOME: /tmp
      FETCHER_TOKEN: "${FETCHER_TOKEN:-}"
    # Not published by default — beacon reaches it over the internal compose network.
    expose:
      - "8080"

volumes:
  beacon-data:
